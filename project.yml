name: Ananta
options:
  bundleIdPrefix: com.utkarsh
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  Ananta:
    type: application
    platform: iOS
    sources:
      - path: Ananta
    dependencies:
      - sdk: libsqlite3.tbd
    info:
      path: Ananta/Info.plist
      properties:
        CFBundleDisplayName: Hindu App
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.education
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.utkarsh.ananta
        PRODUCT_NAME: Hindu App
        PRODUCT_MODULE_NAME: Ananta
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
  AnantaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AnantaTests]
    dependencies:
      - target: Ananta
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  AnantaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AnantaUITests]
    dependencies:
      - target: Ananta
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Ananta:
    build:
      targets:
        Ananta: all
        AnantaTests: [test]
        AnantaUITests: [test]
    test:
      targets: [AnantaTests, AnantaUITests]
